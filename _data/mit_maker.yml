    credits:
      team: "Tarun Malavasan developed the depth-camera controls. Jerry Li built the walker chassis and integrated the motor-control firmware. Andrew Wang was also on the team."
      upstream: "[LeRobot](https://github.com/huggingface/lerobot) (Hugging Face, Apache-2.0) for recording, ACT training, and inference; ACT (Action Chunking with Transformers) by Zhao et al."
