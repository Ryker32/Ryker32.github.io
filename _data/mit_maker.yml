  - id: rocket-engines
    short: "Propane & LOX rocket engines"
    title: "Propane and LOX Rocket Engines"
    date: "2024 – 2026"
    kind: mechanical
    index_tag: Hardware
    tags:
      - { label: Fabrication }
      - { label: Welding }
      - { label: Combustion }
    image: /assets/img/rocket/mk3picture.jpg
    image_alt: "Rocket engine build"
    what: |
      With a group of friends, I built a propane / compressed-air rocket engine (2024–25), and then a custom liquid-oxygen engine burning liquid propane (2025–26). Everything was built from scrap metal and scrap fittings.
    contribution: |
      For the propane engine, I used a used truck muffler as the combustion chamber because it can withstand higher temperatures, and I welded most of the pipe fittings (all except the ignition coil's). To approximate the mixture, I used the cross-sectional area and the combustion ratio to calculate the PSI needed for both the propane and the compressed air. For the LOX engine, I acquired the LOX and liquid propane, used a truck muffler as the mixing chamber with a flanged opening for combustion, and cooled the system with a scrap butane tank and dry ice, since we didn't have liquid nitrogen.
    status: "Experimental builds. I contacted an aerospace engineer from Blue Origin to look over the LOX engine for its initial tests."
