  # ---------------------------------------------------------------------------
  - id: reip-software
    short: "REIP software architecture"
    title: "REIP: Resilient Election & Impeachment Policy"
    date: "2025 – 2026"
    index_tag: Code
    index_tag_kind: code
    tags:
      - { label: Python, kind: code }
      - { label: Multi-agent systems }
      - { label: Fault tolerance }
    image: /assets/img/mit-maker/reip-three-tier.png
    image_fit: contain
    image_alt: "Diagram of REIP's three evidence tiers: personal memory and sensor confirmation are weighted 1.0, peer reports 0.3"
    caption: "Followers weigh their own memory and sensors above what peers report."
    what: |
      A trust-based governance layer for leader–follower robot teams. Every follower checks each leader command against its own evidence and keeps a trust ledger for the leader. A leader whose trust falls too low loses eligibility, and the team elects a replacement, so exploration continues even if the leader hallucinates, freezes, or is compromised.
    contribution: |
      Solo research project, mentored by Avi Soval. I did the literature review, designed the REIP policy, wrote the robot node and the simulator harness, and ran the controlled experiments and ablations.
    detail_title: Implementation detail
    detail: |
      A good leader might send a follower toward any frontier, not just the nearest one, so "is this the command I would have chosen?" flags too many good leaders. The direction-consistency check asks a weaker but more robust question: does the command point within 90° of *any* unexplored cell this robot knows about? A command that points away from all of them is strong evidence the leader has gone bad.
    status: "Evaluated in simulation with injected faults and in physical trials on five robots. Research is ongoing."
    repos:
      - { label: Ryker32/reip-sim-public, url: "https://github.com/Ryker32/reip-sim-public/tree/80c275862c2c2066abd229bb99fa023a0f2191e8" }
    files:
      - path: robot/reip_node.py → assess_leader_command
        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/robot/reip_node.py#L1255-L1447"
        why: "The three-tier check every follower runs on a leader command before executing it."
      - path: robot/reip_node.py → _apply_suspicion_update
        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/robot/reip_node.py#L1460-L1550"
        why: "The trust ledger, which turns accumulated suspicion into the leader's trust score."
      - path: robot/reip_node.py → _compute_mpc_direction_error
        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/robot/reip_node.py#L1551-L1616"
        why: "The direction-consistency check described above."
      - path: robot/reip_node.py → run_election / check_impeachment
        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/robot/reip_node.py#L2121-L2312"
        why: "Leader election, with the trust-eligibility filter that removes a distrusted leader."
      - path: test/isef_experiments.py → ExperimentRunner.run_experiment
        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/test/isef_experiments.py#L1663"
        why: "The simulation loop that runs REIP and the Raft baseline under each fault condition."
      - path: FINDINGS.md
        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/FINDINGS.md"
        why: "My own audit of the codebase and results, including the corrections I made."
