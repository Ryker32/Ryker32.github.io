  - id: golden-retriever
    short: "Golden Retriever robot walker"
    title: "“Golden Retriever” Robot Walker"
    date: "Corgi × YC Hackathon · 2026 · 2nd of 250+ teams"
    index_tag: Code
    index_tag_kind: code
    tags:
      - { label: SO-101 arm, kind: code }
      - { label: LeRobot · ACT }
      - { label: Hackathon }
    image: /assets/img/corgi/text-sim-demo.jpg
    image_alt: "Screenshot of the text-message simulation demo from the hackathon"
    caption: "Simulation demo from the hackathon."
    what: |
      My paralyzed uncle joked that his walker needed a "second pair of hands," so I proposed building one with a team at a Y Combinator × Corgi hackathon. The goal: a robot walker that can autonomously "retrieve" low-to-the-ground items for people with limited mobility, using an SO-101 arm with a learned grasp.
    contribution: |
      I teleoperated an SO-101 arm (with a Logitech camera mounted at the wrist) to collect joint states, state data, and video for training an ACT imitation-learning model, then trained and retrained the policy. I co-designed the winch that lifts the arm to user height, and collaborated with our CV specialist on an HSV classifier that stops the walker's motors and activates the trained grasp sequence when it detects a pill bottle.
    detail_title: Problem → fix
    detail: |
      My first ACT model was trained on low-variance demonstrations, which made it unusable. I recorded new demonstrations with higher variance and retrained, and the arm finally worked. The hardware had its own problem: the arm had to hand the user an item, so it needed a winch to lift it to user height, and nobody had string for a winch cable. The next best option was soft-core wire.
    status: "Hackathon prototype."
    repos:
      - { label: jerryli08/corgi-hackathon (team repo), url: "https://github.com/jerryli08/corgi-hackathon/tree/e683997abcdad08218dbd878d502eb15d7d0c35a" }
    files:
      - path: scripts/record_40.ps1
        url: "https://github.com/jerryli08/corgi-hackathon/blob/e683997abcdad08218dbd878d502eb15d7d0c35a/scripts/record_40.ps1"
        why: "The LeRobot command I used to record the 40-episode teleoperated grasp dataset (leader arm → follower arm, wrist camera at 30 fps)."
      - path: docs/TRAINING_GRASP.md
        url: "https://github.com/jerryli08/corgi-hackathon/blob/e683997abcdad08218dbd878d502eb15d7d0c35a/docs/TRAINING_GRASP.md"
        why: "My plan for the grasp, with a learned ACT policy for the pick and a scripted motion for the hand-off."
      - path: outputs/train/walker_pill_grasp_act/…/train_config.json
        url: "https://github.com/jerryli08/corgi-hackathon/blob/e683997abcdad08218dbd878d502eb15d7d0c35a/outputs/train/walker_pill_grasp_act/checkpoints/015000/pretrained_model/train_config.json"
        why: "The saved ACT training configuration. This file shows the configured run; the committed checkpoint is from step 15,000."
      - path: scripts/run_grasp_policy.py
        url: "https://github.com/jerryli08/corgi-hackathon/blob/e683997abcdad08218dbd878d502eb15d7d0c35a/scripts/run_grasp_policy.py#L278-L382"
