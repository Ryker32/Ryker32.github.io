  - id: xr-teleop
    short: "XR robotic-arm teleoperation"
    title: "XR-Glasses Teleoperation for SO-101 Arms"
    date: "Y Combinator × Soma Capital Hackathon · 2026"
    index_tag: Code
    index_tag_kind: code
    tags:
      - { label: MediaPipe, kind: code }
      - { label: Inverse kinematics }
      - { label: XREAL }
    what: |
      After rewatching Iron Man, I wanted to turn my XR glasses into a controller for SO-101 robotic arms. Hand tracking from the glasses' camera drives the arm's position and gripper in real time.
    contribution: |
      The camera wasn't a normal webcam: it sent 4-bit grayscale frames over TCP. I adapted an open-source decoder, improved contrast, and changed MediaPipe's tracking setup after the hand skeleton kept flickering. For gripper control, I measured 2D thumb–index separation, normalized it by hand size, then smoothed it into a proportional command.
    detail_title: Problem → fix
    detail: |
      The camera's limited field of view meant I kept needing to reposition my hand, and mapping its absolute coordinates to the arm could make the target jump. Borrowing VR's "ratcheting" idea, I made a fist-controlled clutch: hold a fist to freeze the arm's target, move your hand, then release to re-anchor control. I added debouncing against false fist detections, and inverse kinematics to convert relative targets into joint commands.
    status: "Hackathon prototype."
    repos:
      - { label: amzoeee/soma-hackathon (team repo), url: "https://github.com/amzoeee/soma-hackathon/tree/db5ccf77e2f756501d059279d0aedb0f62beab97" }
    files:
      - path: robot/src/camera/xreal_eye.py → _decode
        url: "https://github.com/amzoeee/soma-hackathon/blob/db5ccf77e2f756501d059279d0aedb0f62beab97/robot/src/camera/xreal_eye.py#L110-L116"
        why: "Unpacks the glasses' 4-bit grayscale TCP frames into 8-bit images."
      - path: robot/src/tracking/enhance.py
        url: "https://github.com/amzoeee/soma-hackathon/blob/db5ccf77e2f756501d059279d0aedb0f62beab97/robot/src/tracking/enhance.py"
        why: "Contrast enhancement (CLAHE + gamma) that made the dim grayscale feed trackable."
      - path: robot/src/tracking/hand_tracker.py → process
        url: "https://github.com/amzoeee/soma-hackathon/blob/db5ccf77e2f756501d059279d0aedb0f62beab97/robot/src/tracking/hand_tracker.py#L92-L225"
        why: "My MediaPipe setup changes against skeleton flicker, plus fist detection with hysteresis."
      - path: robot/src/mapping/relative_teleop.py → update
