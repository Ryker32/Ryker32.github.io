# Content for the unlisted MIT Maker Portfolio source-code index (mit-maker.html).
# Only projects with public source files belong here. Links are pinned to commits.
# Entries without a `url` are not rendered. Missing-code items are tracked in
# .mit-maker-private/REPORT.md, not on the page.

title: "MIT Maker Portfolio — Source Code"
intro: "Code supporting the projects in my Maker Portfolio."

projects:

  - id: reip
    title: "REIP: Multi-Robot Trust & Leader Election"
    summary: "Trust-based leader election and impeachment for robot teams, including the Raspberry Pi robot node, Pico motor firmware, and simulation harness."
    repos:
      - { label: "Ryker32/reip-sim-public", url: "https://github.com/Ryker32/reip-sim-public/tree/80c275862c2c2066abd229bb99fa023a0f2191e8" }
    files:
      - { path: "robot/reip_node.py", url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/robot/reip_node.py#L1255-L1447" }
      - { path: "pico/main.py", url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/pico/main.py" }
    credit: "Solo project, mentored by Avi Soval. Later commits were made with Cursor and Claude Code, as marked in the git history."

  - id: golden-retriever
    title: "Golden Retriever Robot Walker"
    summary: "LeRobot demonstration recording and ACT imitation-learning grasp inference for an SO-101 arm mounted on a walker."
    repos:
      - { label: "jerryli08/corgi-hackathon", url: "https://github.com/jerryli08/corgi-hackathon/tree/e683997abcdad08218dbd878d502eb15d7d0c35a" }
    files:
      - { path: "scripts/record_40.ps1", url: "https://github.com/jerryli08/corgi-hackathon/blob/e683997abcdad08218dbd878d502eb15d7d0c35a/scripts/record_40.ps1" }
      - { path: "scripts/run_grasp_policy.py", url: "https://github.com/jerryli08/corgi-hackathon/blob/e683997abcdad08218dbd878d502eb15d7d0c35a/scripts/run_grasp_policy.py#L278-L382" }
    credit: "Team project with Tarun Malarvasan, Jerry Li, and Andrew Wang. Built on Hugging Face LeRobot; some of my commits used Cursor."

  - id: xr-teleop
    title: "XR-Glasses Robotic Arm Teleoperation"
    summary: "Hand tracking from XREAL glasses drives an SO-101 arm, with a fist-controlled clutch, gesture debouncing, and inverse kinematics."
    repos:
      - { label: "amzoeee/soma-hackathon", url: "https://github.com/amzoeee/soma-hackathon/tree/db5ccf77e2f756501d059279d0aedb0f62beab97" }
    files:
      - { path: "robot/src/mapping/relative_teleop.py", url: "https://github.com/amzoeee/soma-hackathon/blob/db5ccf77e2f756501d059279d0aedb0f62beab97/robot/src/mapping/relative_teleop.py#L154-L232" }
      - { path: "robot/src/camera/xreal_eye.py", url: "https://github.com/amzoeee/soma-hackathon/blob/db5ccf77e2f756501d059279d0aedb0f62beab97/robot/src/camera/xreal_eye.py#L110-L116" }
    credit: "Team repository; teammates built the iMessage agent. Uses an open-source XREAL Eye streaming tool, MediaPipe, and ikpy; some of my commits used Cursor."

  - id: bwsi-drone
    title: "BWSI Autonomous Racing Drone"
    summary: "OpenCV line detection for a racing drone's downward camera: my experiment notebook and the team's flight node."
    repos:
      - { label: "Ryker32/CVrykerstuff", url: "https://github.com/Ryker32/CVrykerstuff/tree/43ce2fe7e393b2216c07e60ee5c3bf76941d7230" }
