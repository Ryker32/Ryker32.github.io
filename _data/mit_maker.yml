  - id: bwsi-drone
    short: "BWSI autonomous racing drone"
    title: "MIT Beaver Works Autonomous Racing Drone"
    date: "2025"
    index_tag: Code
    index_tag_kind: code
    tags:
      - { label: OpenCV, kind: code }
      - { label: Raspberry Pi }
      - { label: Team of 5 }
    image: /assets/img/mit-maker/bwsi-line-detection-frame.png
    image_fit: contain
    image_alt: "Downward camera frame from my line-detection experiment: the tape line is boxed in green and magenta segments"
    caption: "One of the archived downward frames I annotated while developing line detection."
    what: |
      An autonomous racing drone that follows a line of tape on the course using a downward-facing PiCam.
    contribution: |
      I worked on the line-following algorithm, which uses OpenCV to filter light values in each downward PiCam frame, contour the highest values that are clustered together, and then regress a movement path for the drone to follow.
    detail_title: Problem → fix
    detail: |
      During the brightest times of the day, sunlight reflected off the tape on the course floor (the tape was there to help the optical-flow sensor), and my program misclassified the reflection as the line. I analyzed the characteristics of the line and of reflections in archived data and found a fix: only allow the contours with the longest edge lengths. This greatly reduced interference with detection and helped us place first in the capstone race in 52 seconds.
    status: "Completed program (summer 2025)."
    repos:
      - { label: Ryker32/CVrykerstuff, url: "https://github.com/Ryker32/CVrykerstuff/tree/43ce2fe7e393b2216c07e60ee5c3bf76941d7230" }
      - { label: amzoeee/line_follower_v2 (team flight code), url: "https://github.com/amzoeee/line_follower_v2/tree/d535b6a33bc5628687f761fc2c7a24259a9e0e11" }
    files:
      - path: CVrykerstuff/testingtet.ipynb
        url: "https://github.com/Ryker32/CVrykerstuff/blob/43ce2fe7e393b2216c07e60ee5c3bf76941d7230/testingtet.ipynb"
        why: "My line-detection experiment on 71 real downward frames. It thresholds, clusters contours, picks the line band, and fits a regression, with annotated output for every frame."
      - path: line_follower_v2/offb_node.py → detect_line, run_drone
        url: "https://github.com/amzoeee/line_follower_v2/blob/d535b6a33bc5628687f761fc2c7a24259a9e0e11/line_follower_v2/offb_node.py#L185-L265"
        why: "The team's flight node. detect_line keeps the contour with the longest bounding-rectangle side (the reflection filter), and run_drone turns the fitted line into velocity and yaw commands."
    credits:
      team: "Built with Mahi Sakharpe, Jerry, Zoe, and Katherine. Jerry designed the Pi enclosure. The flight-code repository is maintained by Zoe."
      upstream: "OpenCV; PX4 / MAVROS; BWSI course materials."

