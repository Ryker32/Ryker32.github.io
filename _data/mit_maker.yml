# Content for the unlisted MIT Maker Portfolio source-code index (mit-maker.html).
# Only projects with public source files belong here. Links are pinned to commits.
# Entries without a `url` are not rendered. Missing-code items are tracked in
# .mit-maker-private/REPORT.md, not on the page.

title: "MIT Maker Portfolio: Source Code"
intro: "Cleaned up code repos, Original source repos, and interactive demos for projects (when needed). NOTE: I utilized Claude Code as a tool to curate a set of cleaned up repos (for viewing pleasure and ease), you can see all of the original version histories of projects in their respective source repos which are located on each project card. I devised every piece of logic within my contributions and worked through every problem and proposed solutions independently. 

 I utilized Claude Code as a tool, not a replacement for my own thought process, allowing me to test my ideas from specifications quickly, giving me more time to work through problems on a given project. "

projects:

  - id: reip
    demo: reip
    title: "Resilient Election & Impeachment Policy (REIP): Software and Hardware"
    summary: "A fault-tolerance policy for leader-follower robot exploration: followers check the leader's commands against their own evidence, track it in a trust ledger, and vote to impeach a faulty leader. Includes the code that ran on my five physical robots and the simulations and trial logs behind the results."
    repos:
      - { kind: clean, label: "Ryker32/reip-robots", url: "https://github.com/Ryker32/reip-robots/tree/82b8b5c377325e44a7d45989072f6d9a68895aa4" }
      - { kind: clean, label: "Ryker32/reip-experiments", url: "https://github.com/Ryker32/reip-experiments/tree/ba9f363925140c3506c0e6a790f3b7609989a402" }
      - { kind: original, label: "Ryker32/reip-sim-public", note: "full history", url: "https://github.com/Ryker32/reip-sim-public/tree/80c275862c2c2066abd229bb99fa023a0f2191e8" }
    files:
      - { path: "reip-robots/robot/reip_node.py", url: "https://github.com/Ryker32/reip-robots/blob/82b8b5c377325e44a7d45989072f6d9a68895aa4/robot/reip_node.py#L1257-L1449" }
      - { path: "reip-robots/pico/main.py", url: "https://github.com/Ryker32/reip-robots/blob/82b8b5c377325e44a7d45989072f6d9a68895aa4/pico/main.py" }
    credit: "Independent research project, mentored by Avi Soval of USC ISI. Claude Code was used to fix unintelligible comments that I left when tired, clean up my documentation files, and sometimes implement quick fixes based off of my own design specifications."

