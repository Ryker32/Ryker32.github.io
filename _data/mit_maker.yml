  - id: soil-monitor
    title: "Active Soil Moisture Monitor (WIP)"
    summary: "ESP32 firmware that calibrates a capacitive soil sensor against wet and dry readings, powers it only while reading, and shows the moisture level as an emoji on an e-paper display."
    repos:
      - { kind: clean, label: "Ryker32/soil-moisture-monitor", url: "https://github.com/Ryker32/soil-moisture-monitor/tree/9af95ca537f4863b1e9504d500d64f88a8722a45" }
