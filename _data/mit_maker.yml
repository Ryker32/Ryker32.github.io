# Content for the unlisted MIT Maker Portfolio page (mit-maker.html).
#
# Rendering rules (so nothing half-finished reaches the public page):
#   - publish: false        -> project is not rendered at all
#   - repos/files/design entries without a `url` are not rendered
#   - empty fields (what, contribution, detail, status, credits.*) are skipped
#   - image_fit: contain    -> show the whole figure instead of cropping to 16:9
# Track missing material and open questions in .mit-maker-private/REPORT.md,
# never here as visible text. All code links are pinned to a commit SHA.

intro:
  heading: Code & design files behind my projects
  body: |
    This page supports my MIT Maker Portfolio. For each project I've listed what it does, what I personally built, one problem I worked through, and the specific files worth opening first. Code links are pinned to a fixed commit, so you see the version I'm describing.

    Team projects credit my collaborators and the open-source work I built on. Mechanical projects describe the design work instead of linking code.

footer: |
  **About this page.** I assembled this page with help from Claude Code (Anthropic's coding assistant), which searched my repositories, proposed which files to highlight, and built the page from my existing site styles. I wrote the project descriptions and decided what to include.

