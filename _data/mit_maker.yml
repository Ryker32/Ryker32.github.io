        url: "https://github.com/Ryker32/reip-sim-public/blob/80c275862c2c2066abd229bb99fa023a0f2191e8/pico/main.py"
        why: "MicroPython firmware on the Pico: motor PWM through the DRV8833, encoder interrupts, and the UART command protocol the Pi uses."
