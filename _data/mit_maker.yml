  - id: cnc-cutter
    short: "CNC foam needle cutter"
    title: "CNC Needle Cutter for Foam Gliders"
    date: "2026"
    kind: mechanical
    index_tag: In progress
    index_tag_kind: wip
    tags:
      - { label: Mechanical design }
      - { label: AltMill }
      - { label: In progress, kind: wip }
    what: |
      I wanted to give away 100 foam gliders at the elementary-school events I host with my aerospace club. I had access to a CNC, so I started from Michael763's open-source needle-cutting tool, with old plywood holding a MIG tip as the needle guide, piano wire as the needle, and a printed chassis.
    contribution: |
      His cutter was meant for 0.025" wire, and my thinner 0.019" wire failed from lateral fatigue (V1a–d). To reduce the stress, I modified V1 by raising the flywheel height above the two guide bearings, and I designed a custom mount for an AltMill 4×4 (V2). In V3 I readjusted that distance and added an electronics box with a simple 2S LiPo, ESC, and servo-controller setup.
    detail_title: Problem → fix
    detail: |
      V4, with an optimized flywheel height, made the first successful cut. I cut one plane before the needle broke from stress. The flywheel design isn't suited to longer cuts, so I'm designing a vertically constrained solution (V5+).
    status: "Under development. One glider cut so far; needle life is the open problem."
    repos: []
    design: []
    credits:
      upstream: "Based on Michael763's open-source needle cutter."

  # ---------------------------------------------------------------------------
  - id: soil-monitor
    short: "Soil-moisture monitor"
    title: "Active Soil-Moisture Monitor"
    date: "2025 – 2026"
    index_tag: Work in progress
    index_tag_kind: wip
    tags:
      - { label: ESP32, kind: code }
      - { label: E-paper }
      - { label: Low power }
      - { label: Work in progress, kind: wip }
    what: |
      My mom and I love plants, but we forget to water them, so I built a soil-moisture monitor. I calibrated the capacitive sensor by placing it in water for a "high" reading and letting it dry for a "low," and a custom Arduino program on an ESP32 updates an e-paper display with an emoji for the measured moisture level.
    contribution: |
      I designed the circuit, calibration, and firmware, and iterated through seven power designs toward one goal: a device that lasts for months on a single battery replacement.
    detail_title: Problem → fix
    detail: |
      V1 sensed continuously through an MT3608 boost converter, whose 0.5–2 mA quiescent draw drained the batteries. In V2 I tried GPIO power gating, but the ESP32's limited current sourcing caused undervoltage and false capacitance readings. V3–6 tested pull-down resistors to stop the quiescent draw (marginal improvement), transistor switching, and RC timing to reduce idle power. V7 combines a MOSFET power gate on the sensor with a TPL5110 timer that cuts power to the entire system between readings.
    status: "Work in progress. The months-long battery-life target has not been demonstrated yet."
    repos:
      - { label: Ryker32/plantmonitor, url: "https://github.com/Ryker32/plantmonitor/tree/8e0afba849431e46b30d5976ad7b057483ce0d46" }
    files:
      - path: plantmonitor/plantmonitor.ino → calibration
        url: "https://github.com/Ryker32/plantmonitor/blob/8e0afba849431e46b30d5976ad7b057483ce0d46/plantmonitor/plantmonitor.ino#L13-L48"
        why: "The dry and wet calibration constants and the linear mapping from raw capacitance to moisture percentage."
      - path: plantmonitor/plantmonitor.ino → sensor power
        url: "https://github.com/Ryker32/plantmonitor/blob/8e0afba849431e46b30d5976ad7b057483ce0d46/plantmonitor/plantmonitor.ino#L50-L69"
        why: "Powers the probe only while reading (the GPIO-gating approach from V2)."
      - path: plantmonitor/plantmonitor.ino → display
        url: "https://github.com/Ryker32/plantmonitor/blob/8e0afba849431e46b30d5976ad7b057483ce0d46/plantmonitor/plantmonitor.ino#L73-L164"
        why: "Maps moisture bands to the face and status text drawn on the e-paper display."
