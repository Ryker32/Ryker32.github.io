  - id: hybrid-uav-ugv
    short: "Hybrid air–ground vehicle"
    title: "Hybrid Air and Ground Vehicle Research"
    date: "BWSI / IEEE URTC · 2025"
    kind: mechanical
    index_tag: Mechanical
    tags:
      - { label: Mechanical design }
      - { label: Passive docking }
      - { label: IEEE URTC }
    image: /assets/img/bwsicars/cardrone.png
    image_alt: "Quadcopter with the ground rover docked underneath"
    what: |
      What if a rescue rover can't traverse a specific stretch of terrain? I co-led a team to develop a hybrid system in which an aerial robot picks up a ground robot, carries it long distances, and deploys it somewhere new.
    contribution: |
      Power was a large constraint for us, so active latching mechanisms that need constant power were out of the question. I proposed the V1 concept, a "disk cam with linear sliders" that needs a single servo action when the drone lands on the car, and then suggested the passive V2 latch. The mechanical design took several revisions: I reworked the landing gear and relocated the battery to fit the assembled system.
    detail_title: Problem → fix
    detail: |
      V1 would have put a significant load on two sliders. For V2 I suggested a design inspired by gravity latches: rubber bands hold two "barn doors" shut, and the drone pushes through them as it docks. Docking becomes easy, guided, and passive, with no slider actuation to coordinate.
    status: "Working prototype; presented as a poster at the IEEE MIT Undergraduate Research and Technology Conference (URTC)."
    repos: []
    design: []
    credits:
      team: "Co-authors on the URTC poster: Jerry Li, Mihika Sakharpe, Zoe Zhao, Katherine Zhang, Shashwat Pandya, and Chris Rincon."

  # ---------------------------------------------------------------------------
  - id: whiteboard
    short: "Whiteboard message extraction"
    title: "Journalism: Extracting Handwritten Messages with OpenCV"
    date: "2026"
    index_tag: Code
    index_tag_kind: code
    tags:
      - { label: OpenCV, kind: code }
      - { label: Python }
      - { label: Image processing }
    what: |
      At a school assembly I gathered students to write warm wishes for our principal on a whiteboard. Instead of sending them as plain text, I wanted to keep the person behind each message, so I developed an OpenCV pipeline that separates the colored writing from the photographed whiteboard and exports each message as its own PNG. I used the PNGs to design the front page of our school newspaper.
    contribution: |
      I specified each stage of the pipeline: HSV thresholding, background estimation, and message extraction through alpha matting and color unmixing. Claude Code implemented the specifications. I diagnosed failures, redesigned the stages that failed, and verified the exports against the original image.
    detail_title: Problem → fix
    detail: |
      Thick marker strokes came out hollow because the background estimates often included stray ink. A "double pass" masks the detected ink, reconstructs the background, and repeats the extraction. In a synthetic test, this raised thick-stroke core fill from 56.6% to 100%.
    status: "Complete. The exported PNGs were used to design the newspaper's front page."
    repos: []
    files: []
    credits:
      ai: "Claude Code wrote the implementation to my stage-by-stage specifications. I designed the pipeline, diagnosed failures, redesigned the masking and background reconstruction, and verified the exports."

