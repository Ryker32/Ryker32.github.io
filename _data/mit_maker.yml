    repos:
      - { kind: clean, label: "Ryker32/golden-retriever-act-grasp", url: "https://github.com/Ryker32/golden-retriever-act-grasp/tree/f46c841e1ddedf226543a05a1554c290d0e162e9" }
      - { kind: original, label: "jerryli08/corgi-hackathon", note: "team repo", url: "https://github.com/jerryli08/corgi-hackathon/tree/e683997abcdad08218dbd878d502eb15d7d0c35a" }
    files:
