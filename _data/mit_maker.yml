    files:
      - { path: "CVrykerstuff/testingtet.ipynb", url: "https://github.com/Ryker32/CVrykerstuff/blob/43ce2fe7e393b2216c07e60ee5c3bf76941d7230/testingtet.ipynb" }
      - { path: "line_follower_v2/offb_node.py", url: "https://github.com/amzoeee/line_follower_v2/blob/d535b6a33bc5628687f761fc2c7a24259a9e0e11/line_follower_v2/offb_node.py#L185-L265" }
    credit: "Flight code is the team repository, maintained by Zoe; team included Mihika Sakharpe, Jerry, and Katherine."

