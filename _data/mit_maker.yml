  # ---------------------------------------------------------------------------
  - id: reip-hardware
    short: "REIP hardware integration"
    title: "REIP Hardware Integration: Robots for Real-World Trust Experiments"
    date: "2025 – 2026"
    index_tag: Code + hardware
    index_tag_kind: code
    tags:
      - { label: Raspberry Pi + Pico, kind: code }
      - { label: ToF sensing }
      - { label: ArUco tracking }
    image: /assets/img/mit-maker/reip-hardware-snapshot.png
    image_alt: "Overhead view of five REIP robots with ArUco tags in three stages: normal operation, a faulted leader, and the team stabilized under a newly elected leader"
    caption: "REIP on my robots: normal → faulted leader → stabilized under a new leader. Red arrows are leader commands."
    what: |
      I spent a year developing a democratic fault-tolerance policy for robot teams (REIP, next section), and I needed to validate it in the real world. These are the small ground robots I designed and built to run it on: a Raspberry Pi runs the REIP node and talks to a Pico that drives the motors.
    contribution: |
      Building the robot was arguably the hardest part. I only had 1:100 N20 motors, which put a hard limit on mass, so I called a friend who taught me how to efficiently pocket 3D designs to cut weight (V6). I used time-of-flight sensors to build a 2D point map for obstacle detection (V1–V2). Mounts that fit my N20s didn't exist, so I designed my own snug-fit mounts. V10–12 iterated on where the battery sits and got the robots ready for experiments: a 2S LiPo with a 5V BEC, and ArUco tags on each robot for position tracking during data collection.
    detail_title: Problem → fix
    detail: |
      By V9 I had finished my second build and realized that with 20+ wires on the robot, it's smarter to use soft-core wire than solid-core, so I rewired with soft-core.
    status: "Five robots built (V12) and used for physical REIP trials."
    repos:
      - { label: Ryker32/reip-sim-public, url: "https://github.com/Ryker32/reip-sim-public/tree/80c275862c2c2066abd229bb99fa023a0f2191e8" }
