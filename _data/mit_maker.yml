    credit: "E-paper driver from the display maker's sample code; fonts © STMicroelectronics."

  - id: weatherbrick
    title: "Weather Brick"
    summary: "An ESP32 and TFT desk gadget for a sailor friend: it pulls weather data from the Windy.com API and shows it in SI units with a wind direction display."
    repos:
      - { kind: original, label: "Ryker32/weatherbrick", note: "full history", url: "https://github.com/Ryker32/weatherbrick.git" }
    credit: "All original work."

  - id: whiteboard
    title: "Journalism 2026: Whiteboard Messages"
    summary: "An OpenCV pipeline that separates students' colored marker writing from a photographed whiteboard and exports each message as a PNG for the newspaper's front page."
    repos:
      - { kind: original, label: "Ryker32/whiteboard", note: "full history", url: "https://github.com/Ryker32/Olympus_Whiteboard.git" }
    credit: "I specified each stage of the pipeline; Claude Code implemented the specifications. I diagnosed failures, redesigned, and verified exports against the original image."

  - id: yc-agent-jam
    title: "Y Combinator Agent Jam"
    summary: "A mobile robot capable of interpreting its environment, responding to potentially dangerous objects with body language, and manipulating objects with a robotic arm."
    repos:
      - { kind: original, label: "ZakHussain/dodo-cli-agent", note: "team repo", url: "https://github.com/ZakHussain/dodo-cli-agent/tree/ac20612cf9c69976f7364f3e1dff2e59370a1afb" }
    credit: "Built with a local robotics professor and a robotics company owner; the code lives in Zak Hussain's repository. I trained the object classifier on an open source HuggingFace model and used an ACT model to train manipulation tasks."