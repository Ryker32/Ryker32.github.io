    what: |
      These smaller projects trace how I developed my electronics skills before taking on larger robotic systems.
    contribution: |
      I started in 2024 building display circuits with my dad, learning how software, microcontrollers, and physical wiring interact and respond to resistors, capacitors, and other components. In 2025 I experimented with 16-bit analog-to-digital conversion and I²C communication, which became the basis for my robotics research. I also worked on sensor-feedback projects with a local professor I met at a hackathon.
    detail_title: Going below the libraries
    detail: |
      A YouTube video inspired me to go beyond software libraries, so I used one of my dad's old circuitry books to learn the display decoding and circuit logic needed to build a 4-bit binary-to-decimal display. I also experimented with a Z80 processor in a free-run configuration, exploring active-low control signals, pull-down resistors, and current limiting.
    status: "Breadboard work. I haven't made a proper PCB yet, but breadboarding gave me the skills to design circuits for my robots."
